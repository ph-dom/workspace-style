<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1fb8a6"/>
      <stop offset="0.35" stop-color="#5b3fa8"/>
      <stop offset="0.62" stop-color="#e8457e"/>
      <stop offset="0.72" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe66b"/>
      <stop offset="0.55" stop-color="#ff9a3c"/>
      <stop offset="1" stop-color="#ff3d8b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a0f5c"/>
      <stop offset="1" stop-color="#14062b"/>
    </linearGradient>
    <linearGradient id="text" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#fff1c2"/>
      <stop offset="1" stop-color="#ffc2e0"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="0" y="118" width="256" height="3" fill="#000"/>
      <rect x="0" y="128" width="256" height="4" fill="#000"/>
      <rect x="0" y="139" width="256" height="5" fill="#000"/>
      <rect x="0" y="151" width="256" height="6" fill="#000"/>
    </mask>
    <clipPath id="frame">
      <rect width="256" height="256" rx="48"/>
    </clipPath>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="b"/>
      <feFlood flood-color="#ff2fa0" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="256" height="256" fill="url(#sky)"/>
    <!-- horizon haze lines -->
    <g stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5">
      <line x1="0" y1="34" x2="256" y2="34"/>
      <line x1="0" y1="44" x2="256" y2="44"/>
    </g>
    <!-- sun -->
    <circle cx="128" cy="112" r="70" fill="url(#sun)" mask="url(#sunStripes)"/>
    <!-- floor -->
    <rect x="0" y="166" width="256" height="90" fill="url(#floor)"/>
    <line x1="0" y1="166" x2="256" y2="166" stroke="#ff4fb0" stroke-width="3"/>
    <g stroke="#ff4fb0" stroke-opacity="0.75" stroke-width="2">
      <line x1="0" y1="180" x2="256" y2="180"/>
      <line x1="0" y1="198" x2="256" y2="198"/>
      <line x1="0" y1="224" x2="256" y2="224"/>
      <line x1="128" y1="166" x2="128" y2="256"/>
      <line x1="104" y1="166" x2="40" y2="256"/>
      <line x1="152" y1="166" x2="216" y2="256"/>
      <line x1="80" y1="166" x2="-48" y2="256"/>
      <line x1="176" y1="166" x2="304" y2="256"/>
    </g>
  </g>

  <!-- letters -->
  <text x="128" y="160" text-anchor="middle"
        font-family="'Arial Black', 'Segoe UI Black', sans-serif" font-weight="900"
        font-size="104" letter-spacing="-4"
        fill="url(#text)" stroke="#2a0b4a" stroke-width="5" paint-order="stroke"
        filter="url(#glow)">WS</text>
</svg>
